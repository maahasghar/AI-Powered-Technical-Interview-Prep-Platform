name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports:
          - 5432:5432

      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:
      RUN_DOCKER_TESTS: "1"
      RUN_REDIS_TESTS: "1"
      DATABASE_URL: postgresql://app:app@localhost:5432/app_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-test-secret

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Wait for PostgreSQL
        run: |
          for attempt in {1..30}; do
            pg_isready -h localhost -p 5432 -U app -d app_test && exit 0
            sleep 1
          done
          exit 1

      - name: Apply database migrations
        working-directory: backend/app
        run: python -m alembic upgrade head
      
      - run: ruff check backend
      - run: black --check backend
      - run: isort --check-only backend

      - name: Build isolated Python judge
        run: docker build -t interview-judge-python:local backend/judge

      - run: pytest backend/app/tests

      - name: Build Docker image
        run: docker build -t backend ./backend

      - name: Build worker and verify judge access
        run: |
          docker build -f backend/Dockerfile.worker -t interview-judge-worker:test backend
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock --entrypoint python interview-judge-worker:test -c 'from app.judge.docker_runner import DockerRunner; assert DockerRunner().run_case("def solve(): return 1", {}).actual == 1'

      - name: Run pre-commit
        run: |
          pre-commit run --all-files

  frontend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --watchAll=false

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run browser end-to-end tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Build frontend
        working-directory: frontend
        run: npm run build

