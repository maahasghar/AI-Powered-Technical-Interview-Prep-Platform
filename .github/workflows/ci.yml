name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports:
          - 5432:5432

      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:
      RUN_REDIS_TESTS: "1"
      DATABASE_URL: postgresql://app:app@localhost:5432/app_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-test-secret

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Wait for PostgreSQL
        run: |
          for attempt in {1..30}; do
            pg_isready -h localhost -p 5432 -U app -d app_test && exit 0
            sleep 1
          done
          exit 1

      - name: Apply database migrations
        working-directory: backend/
        run: python -m alembic upgrade head
      
      - run: ruff check backend
      - run: black --check backend
      - run: isort --check-only backend

      - run: pytest backend/app/tests
      - name: Test combined worker supervision
        run: PYTHONPATH=backend python -m unittest discover -s backend/tests -v

      - name: Build Docker image
        run: docker build -t backend ./backend

      - name: Build worker and smoke-test E2B integration
        run: |
          docker build -f backend/Dockerfile.worker -t interview-judge-worker:test backend
          docker run --rm -i --network none \
            -e DATABASE_URL -e REDIS_URL -e JWT_SECRET \
            --entrypoint python interview-judge-worker:test - <<'PY'
          from types import SimpleNamespace
          from unittest.mock import Mock
          from app.judge.execution_provider import E2BExecutionProvider
          from app.judge.worker import evaluate

          # Check the packaged provider and worker without paid sandbox requests.
          sandbox = Mock()
          sandbox.commands.run.return_value = SimpleNamespace(
              stdout="1", stderr="", exit_code=0, error=None
          )
          factory = Mock()
          factory.create.return_value = sandbox
          provider = E2BExecutionProvider(api_key="ci-test-key", sandbox_factory=factory)
          result = evaluate("def solve(): return 1", [{"input": {}, "expected": 1}], provider)
          assert result.status == "PASSED", result
          assert result.tests_passed == 1, result
          factory.create.assert_called_once()
          sandbox.commands.run.assert_called_once()
          sandbox.kill.assert_called_once()

          # Verify Ollama's binary and runtime libraries in the final image.
          # No model download or external network access is needed.
          import os
          from app.scripts.run_workers import Supervisor
          supervisor = Supervisor()
          os.environ["OLLAMA_HOST"] = "127.0.0.1:11434"
          try:
              supervisor.start("Ollama smoke test", ["ollama", "serve"])
              assert isinstance(supervisor.wait_for_ollama(30), list)
          finally:
              supervisor.shutdown()
          PY

      - name: Run pre-commit
        run: |
          pre-commit run --all-files

  frontend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --watchAll=false

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run browser end-to-end tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Build frontend
        working-directory: frontend
        run: npm run build
